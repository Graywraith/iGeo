<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title>Fossil Geo Logo</title>
  <desc>Logo depicting geological strata with embedded fossil motifs and theme-aware gradients</desc>

  <!-- Background Gradient -->
  <defs>
    <linearGradient id="geoGradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4af7f" />
      <stop offset="50%" stop-color="#7f5f3c" />
      <stop offset="100%" stop-color="#2c2c2c" />
    </linearGradient>
    <clipPath id="strataClip">
      <path d="M0,50 Q75,80 150,60 Q225,40 300,70 V300 H0 Z" />
    </clipPath>
  </defs>

  <!-- Strata Layers -->
  <g clip-path="url(#strataClip)">
    <rect width="300" height="300" fill="url(#geoGradient)" />
    
    <!-- Fossil Motifs -->
    <path d="M80,120 Q85,115 90,120 Q95,125 90,130 Q85,135 80,130 Q75,125 80,120 Z"
          fill="#f0e6d2" opacity="0.8" />
    <path d="M200,180 C205,170 215,170 220,180 C225,190 215,200 205,195 C195,190 195,185 200,180 Z"
          fill="#e0d4b0" opacity="0.7" />
  </g>

  <!-- Text Label -->
  <text x="150" y="280" font-family="Verdana, sans-serif" font-size="20" fill="#f0e6d2" text-anchor="middle">
    Fossil Geo
  </text>
</svg>