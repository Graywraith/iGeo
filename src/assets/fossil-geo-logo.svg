<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect x="0" y="0" width="400" height="100" fill="transparent"/>
  
  <!-- Geological layers (enhanced) -->
  <g id="layers" opacity="0.45">
    <path d="M 0 50 L 120 50 L 120 58 L 0 58 Z" fill="#6B4423"/>
    <path d="M 0 58 L 120 58 L 120 67 L 0 67 Z" fill="#8B5A3C"/>
    <path d="M 0 67 L 120 67 L 120 76 L 0 76 Z" fill="#A0704D"/>
    <path d="M 0 76 L 120 76 L 120 85 L 0 85 Z" fill="#C48A5F"/>
    <path d="M 0 85 L 120 85 L 120 92 L 0 92 Z" fill="#D9A574"/>
    <!-- Add texture lines to layers -->
    <line x1="10" y1="54" x2="110" y2="54" stroke="#4A2F1A" stroke-width="0.8" opacity="0.6"/>
    <line x1="15" y1="62.5" x2="105" y2="62.5" stroke="#5A3F2A" stroke-width="0.8" opacity="0.6"/>
    <line x1="8" y1="71.5" x2="112" y2="71.5" stroke="#6A4F3A" stroke-width="0.8" opacity="0.6"/>
    <line x1="12" y1="80.5" x2="108" y2="80.5" stroke="#7A5F4A" stroke-width="0.8" opacity="0.6"/>
    <line x1="18" y1="88.5" x2="102" y2="88.5" stroke="#8A6F5A" stroke-width="0.8" opacity="0.6"/>
  </g>
  
  <!-- Trilobite fossil icon -->
  <g id="trilobite" transform="translate(60, 50)">
    <!-- Trilobite body -->
    <ellipse cx="0" cy="0" rx="28" ry="20" fill="none" stroke="#FFB84D" stroke-width="2.5"/>
    
    <!-- Central axis -->
    <line x1="0" y1="-20" x2="0" y2="20" stroke="#FFB84D" stroke-width="2"/>
    
    <!-- Head (cephalon) -->
    <path d="M -20 -15 Q 0 -22 20 -15" fill="none" stroke="#FFB84D" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-12" cy="-16" r="3" fill="#FFB84D" opacity="0.8"/>
    <circle cx="12" cy="-16" r="3" fill="#FFB84D" opacity="0.8"/>
    
    <!-- Segments (thorax) -->
    <path d="M -22 -8 Q 0 -10 22 -8" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    <path d="M -24 -2 Q 0 -4 24 -2" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    <path d="M -25 4 Q 0 2 25 4" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    <path d="M -24 10 Q 0 8 24 10" fill="none" stroke="#FFB84D" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Tail (pygidium) -->
    <path d="M -18 16 Q 0 22 18 16" fill="none" stroke="#FFB84D" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Pleural spines (side details) -->
    <g opacity="0.6">
      <line x1="-22" y1="-8" x2="-26" y2="-6" stroke="#FFB84D" stroke-width="1.5"/>
      <line x1="22" y1="-8" x2="26" y2="-6" stroke="#FFB84D" stroke-width="1.5"/>
      <line x1="-24" y1="-2" x2="-28" y2="1" stroke="#FFB84D" stroke-width="1.5"/>
      <line x1="24" y1="-2" x2="28" y2="1" stroke="#FFB84D" stroke-width="1.5"/>
      <line x1="-25" y1="4" x2="-29" y2="7" stroke="#FFB84D" stroke-width="1.5"/>
      <line x1="25" y1="4" x2="29" y2="7" stroke="#FFB84D" stroke-width="1.5"/>
    </g>
  </g>
  
  <!-- Location pin integrated -->
  <g id="location-pin" transform="translate(60, 35)" opacity="0.4">
    <path d="M 0 -8 Q -4 -8 -4 -4 Q -4 0 0 6 Q 4 0 4 -4 Q 4 -8 0 -8 Z" 
          fill="none" stroke="#FFB84D" stroke-width="1.5"/>
    <circle cx="0" cy="-4" r="1.5" fill="#FFB84D"/>
  </g>
  
  <!-- Vertical separator -->
  <line x1="115" y1="25" x2="115" y2="75" stroke="#FFB84D" stroke-width="2" opacity="0.3"/>
  
  <!-- Text -->
  <text x="130" y="58" font-family="'Orbitron', 'Exo 2', 'Rajdhani', 'Audiowide', sans-serif" font-size="38" font-weight="700" 
        fill="#2C1810" letter-spacing="3" font-style="italic">fossil</text>
  <text x="245" y="58" font-family="Arial, sans-serif" font-size="38" font-weight="300" 
        fill="#FFB84D" letter-spacing="4">GEO</text>
  
  <!-- Subtle tagline/descriptor -->
  <text x="130" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="300" 
        fill="#8B4513" letter-spacing="1.5" opacity="0.7">DISCOVER WHAT LIES BENEATH</text>
</svg>